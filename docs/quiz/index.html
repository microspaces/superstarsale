const BUILD = "question bank: 91 claims from 105 research reports";
const N_PER_DAY = 5, N_PRACTICE = 10;
const VERDICTS = {
  "Worth Trying": { cls: "v-wt", label: "✅ Worth Trying" },
  "Mixed":        { cls: "v-mixed", label: "🤔 Mixed" },
  "Skip":         { cls: "v-skip", label: "🚫 Skip" }
};
const ORDER = ["Worth Trying", "Mixed", "Skip"];

// ---------- deterministic RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dayPick(dayNum, n){
  const idx = [...QUESTIONS.keys()];
  const rnd = mulberry32(dayNum * 2654435761 % 4294967296);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, n);
}
function utcDay(){ return Math.floor(Date.now() / 86400000); }
function dayLabel(){ return new Date().toISOString().slice(0, 10); }

// ---------- state ----------
let state = null;
function loadStats(){ try { return JSON.parse(localStorage.getItem("hc_stats")) || {games:0, best:0, streak:0, lastDay:null}; } catch(e){ return {games:0, best:0, streak:0, lastDay:null}; } }
function saveStats(s){ localStorage.setItem("hc_stats", JSON.stringify(s)); }

function startDaily(){
  const d = utcDay();
  const saved = JSON.parse(localStorage.getItem("hc_day_" + d) || "null");
  document.getElementById("modeDaily").classList.add("active");
  document.getElementById("modePractice").classList.remove("active");
  document.getElementById("quizNum").textContent = "#" + d;
  if (saved) { renderResults({qs: saved.qids.map(i=>QUESTIONS[i]), picks: saved.picks, mode: "daily", replay: true}); return; }
  newGame(dayPick(d, N_PER_DAY).map(i=>QUESTIONS[i]), "daily");
}
function startPractice(){
  document.getElementById("modePractice").classList.add("active");
  document.getElementById("modeDaily").classList.remove("active");
  const idx = [...QUESTIONS.keys()];
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  newGame(idx.slice(0, N_PRACTICE).map(i=>QUESTIONS[i]), "practice");
}
function newGame(qs, mode){
  state = { qs, i: 0, picks: [], mode };
  renderQuestion();
}
function pick(ans){
  const q = state.qs[state.i];
  state.picks.push({ pick: ans, correct: ans === q.answer });
  renderReveal(q, ans);
}
function next(){
  state.i++;
  if (state.i >= state.qs.length) finishGame(); else renderQuestion();
}

// ---------- rendering ----------
function renderQuestion(){
  const q = state.qs[state.i];
  const dots = state.qs.map((_, j) => {
    if (j < state.picks.length) return `<span class="dot ${state.picks[j].correct ? "hit" : "miss"}"></span>`;
    if (j === state.i) return `<span class="dot cur"></span>`;
    return `<span class="dot"></span>`;
  }).join("");
  document.getElementById("game").innerHTML = `
  <div class="card">
    <div class="meta-row">
      <span class="badge">${state.mode === "daily" ? "📆 Daily " + dayLabel() : "🎯 Practice"}</span>
      <span>Q${state.i + 1} / ${state.qs.length}</span>
    </div>
    <div class="progress-dots">${dots}</div>
    <div class="kicker">The pitch — from “${esc(q.video)}”</div>
    <div class="claim"><span class="q">“</span>${esc(q.show)}<span class="q">”</span></div>
    <p class="prompt">After checking receipts, our research called it…</p>
    <div class="answers">
      ${ORDER.map(a => `<button class="ans-btn" id="ans-${a.replace(/\s/g,"")}" onclick="pick('${a}')"><span>${VERDICTS[a].label}</span><span>›</span></button>`).join("")}
    </div>
    <div id="reveal"></div>
  </div>`;
  window.scrollTo({top: 0, behavior: "smooth"});
}
function renderReveal(q, ans){
  ORDER.forEach(a => {
    const btn = document.getElementById("ans-" + a.replace(/\s/g,""));
    btn.disabled = true;
    if (a === q.answer) btn.classList.add(ans === a ? "correct-pick" : "was-true");
    else if (a === ans) btn.classList.add("wrong-pick");
  });
  const v = VERDICTS[q.answer];
  const score = q.score ? ` <span style="opacity:.7;font-weight:600">· ${q.score}/10</span>` : "";
  document.getElementById("reveal").innerHTML = `
  <div class="reveal">
    <div class="verdict-line ${v.cls}">Verdict: ${v.label}${score}</div>
    <div class="rationale">${esc(q.rationale)}</div>
    ${q.receipts ? `<div class="receipts"><b>Receipts:</b> ${esc(q.receipts)}</div>` : ""}
    ${q.link ? `<a class="src-link" href="${q.link}" target="_blank" rel="noopener">Read the full research ↗</a>` : ""}
    <button class="next-btn" onclick="next()">${state.i + 1 >= state.qs.length ? "See results →" : "Next claim →"}</button>
  </div>`;
}
function rankOf(score, n){
  if (score === n) return "🏆 Receipts Detector — nothing gets past you";
  if (score >= n - 1) return "🎯 Hype Radar — finely tuned";
  if (score >= Math.ceil(n / 2)) return "👀 Getting Warm";
  return "💸 Marketed — the funnel got you";
}
function finishGame(){ renderResults({qs: state.qs, picks: state.picks, mode: state.mode}); }
function renderResults(r){
  const score = r.picks.filter(p => p.correct).length;
  const grid = r.picks.map(p => p.correct ? "🟩" : "🟥").join("");
  let streakNote = "";
  if (r.mode === "daily" && !r.replay) {
    const d = utcDay();
    localStorage.setItem("hc_day_" + d, JSON.stringify({ qids: r.qs.map(q => QUESTIONS.indexOf(q)), picks: r.picks }));
    const s = loadStats();
    if (s.lastDay !== d) { s.streak = (s.lastDay === d - 1) ? s.streak + 1 : 1; s.lastDay = d; s.games++; }
    s.best = Math.max(s.best, s.streak); saveStats(s);
    streakNote = `<div class="countdown">🔥 ${s.streak}-day streak · next quiz in <span id="cd"></span></div>`;
    startCountdown();
  }
  const st = loadStats();
  const shareText = `🔥 Hype Check ${r.mode === "daily" ? "#" + utcDay() : "(practice)"} — ${score}/${r.qs.length}\n${grid}\nCan you spot the AI-money hype? ${location.href.split("?")[0]}`;
  const list = r.qs.map((q, i) => {
    const p = r.picks[i];
    return `<div class="ans-row"><span>${p.correct ? "🟩" : "🟥"}</span><span class="t">${esc(q.video)}</span><span>${VERDICTS[q.answer].label.split(" ")[0]}</span></div>`;
  }).join("");
  document.getElementById("game").innerHTML = `
  <div class="card score-hero">
    <div class="meta-row"><span class="badge">${r.mode === "daily" ? "📆 Daily " + dayLabel() : "🎯 Practice"}${r.replay ? " · already played" : ""}</span></div>
    <div class="score-big">${score}/${r.qs.length}</div>
    <div class="rank">${rankOf(score, r.qs.length)}</div>
    <div class="grid-emo">${grid}</div>
    <button class="share-btn" onclick='shareResult(${JSON.stringify(shareText).replace(/'/g,"&#39;")})'>📋 Share result</button>
    <div class="stats-row">
      <div class="stat"><div class="n">${st.games}</div><div class="l">Games</div></div>
      <div class="stat"><div class="n">${st.streak}🔥</div><div class="l">Streak</div></div>
      <div class="stat"><div class="n">${st.best}</div><div class="l">Best streak</div></div>
      <div class="stat"><div class="n">${QUESTIONS.length}</div><div class="l">Claim bank</div></div>
    </div>
    <div class="answered-list">${list}</div>
    <button class="ghost-btn" style="margin-top:12px" onclick="startPractice()">🎯 Play a practice round</button>
    ${streakNote}
  </div>`;
}
function shareResult(text){
  const done = () => { const t = document.getElementById("toast"); t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); };
  if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
}
function startCountdown(){
  const tick = () => {
    const el = document.getElementById("cd"); if (!el) return;
    const now = new Date(); const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1));
    const s = Math.max(0, Math.floor((next - now) / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    el.textContent = `${h}h ${m}m`;
  };
  tick(); setInterval(tick, 30000);
}
function esc(s){ return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
document.getElementById("buildInfo").textContent = BUILD;
startDaily();
</script>
