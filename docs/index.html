var kind='all', tag='', sort='new', q='';
function chip(txt, cls){ return '<span class="chip '+cls+'">'+txt+'</span>'; }
function render(){
  var items = REPORTS.filter(function(r){
    if(kind!=='all' && r.kind!==kind) return false;
    if(tag && r.tags.indexOf(tag)===-1) return false;
    if(q && (r.title+' '+r.date).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  items.sort(function(a,b){
    if(sort==='old') return a.date<b.date?-1:1;
    if(sort==='videos') return b.videos-a.videos || (a.date<b.date?1:-1);
    if(sort==='avg') return (b.avg||0)-(a.avg||0) || (a.date<b.date?1:-1);
    if(sort==='wt') return b.wt-a.wt || (a.date<b.date?1:-1);
    return a.date>b.date?-1:1;
  });
  var html = items.map(function(r){
    var stats = '';
    if(r.videos) stats += chip(r.videos+' videos','stat');
    if(r.wt) stats += chip('&#9989; '+r.wt+' WT','stat wt');
    if(r.mixed) stats += chip(r.mixed+' mixed','stat');
    if(r.skip) stats += chip(r.skip+' skip','stat skip');
    if(r.avg!==null && r.avg!==undefined) stats += chip('avg '+r.avg+'/10','stat');
    if(r.top) stats += chip('&#127942; '+r.top,'stat');
    if(!stats) stats = '<span class="chip nostats">summary edition</span>';
    var tags = r.tags.map(function(t){ return chip(t,'tag'); }).join('');
    return '<a class="report-item" href="'+r.file+'">'+
      '<div><div class="report-date">'+r.date+' '+chip(r.kind==='daily'?'&#128197; Daily':'&#127909; Playlist','kind-'+r.kind)+'</div>'+
      '<div class="report-title">'+r.title+'</div>'+
      '<div>'+tags+' '+stats+'</div></div>'+
      '<span class="report-arrow">&rarr;</span></a>';
  }).join('');
  document.getElementById('list').innerHTML = html;
  document.getElementById('empty').style.display = items.length ? 'none' : 'block';
}
document.querySelectorAll('.kind-filter').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.kind-filter').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); kind=b.dataset.kind; render();
  });
});
document.getElementById('tag-filter').addEventListener('change', function(e){ tag=e.target.value; render(); });
document.getElementById('sort').addEventListener('change', function(e){ sort=e.target.value; render(); });
document.getElementById('search').addEventListener('input', function(e){ q=e.target.value.toLowerCase(); render(); });
render();
